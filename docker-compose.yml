version: "3.9"

services:

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shriramya
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./wordpress_conf/mysql-performance.cnf:/etc/mysql/conf.d/zzz-performance.cnf:ro
    ports:
      - "3307:3306"

  wordpress:
    image: wordpress:latest
    restart: always
    depends_on:
      - mysql
    volumes:
      - ./wordpress:/var/www/html
      - ./uploads:/var/www/html/wp-content/uploads
      - ./wordpress_conf/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppassword
      WORDPRESS_DB_NAME: shriramya
      WP_REDIS_HOST: redis
      WP_REDIS_PORT: 6379
      WP_REDIS_DATABASE: 0
      WP_REDIS_CLIENT: predis
      WP_REDIS_PREFIX: "shriramya:"
      WP_CACHE_KEY_SALT: "shriramya:"

  mongodb:
    image: mongo:6
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend_node
    restart: always
    env_file:
      - ./backend_node/.env
    depends_on:
      - mongodb
      - mysql
    environment:
      MONGO_URL: mongodb://mongodb:27017/
      DB_NAME: shriramya
    volumes:
      - upload_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8080
    restart: always
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --save 60 1000
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  wpcli:
    image: wordpress:cli
    restart: "no"
    depends_on:
      - mysql
      - wordpress
      - redis
    volumes:
      - ./wordpress:/var/www/html
      - ./wordpress_conf/setup-redis-cache.sh:/usr/local/bin/setup-redis-cache.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/setup-redis-cache.sh"]

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
      - wordpress
      - redis
      - wpcli

volumes:
  mysql_data:
  mongo_data:
  upload_data:
  redis_data:
