version: "3.9"

services:

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shriramya
      MYSQL_USER: shriramya_user
      MYSQL_PASSWORD: shriramya_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_conf/mysql-performance.cnf:/etc/mysql/conf.d/zzz-performance.cnf:ro
    ports:
      - "3307:3306"

  mongodb:
    image: mongo:6
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend_node
    restart: always
    env_file:
      - ./backend_node/.env
    depends_on:
      - mongodb
      - mysql
    environment:
      MONGO_URL: mongodb://mongodb:27017/
      DB_NAME: shriramya
    volumes:
      - upload_data:/app/uploads
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8080
    restart: always
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --save 60 1000
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - frontend_build:/usr/share/nginx/html
    depends_on:
      - frontend
      - backend
      - redis
      - ai-proxy

  ai-proxy:
    build: ./ai-proxy
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - ai_proxy_data:/root/.claude

volumes:
  mysql_data:
  mongo_data:
  upload_data:
  redis_data:
  ai_proxy_data:
  frontend_build:
