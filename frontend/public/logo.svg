<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and filters -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F9E29C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <filter id="subtleDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" />
      <feOffset dx="0.5" dy="0.5" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background (Optional - set to transparent for production) -->
  <rect width="400" height="120" fill="none" />

  <!-- Lotus/Mandala Motif -->
  <g transform="translate(40, 60) scale(0.6)" filter="url(#subtleDropShadow)">
    <path d="M0 -40 C10 -60, 30 -60, 40 -40 C60 -30, 60 -10, 40 0 C60 10, 60 30, 40 40 C30 60, 10 60, 0 40 C-10 60, -30 60, -40 40 C-60 30, -60 10, -40 0 C-60 -10, -60 -30, -40 -40 C-30 -60, -10 -60, 0 -40" fill="url(#goldGradient)" />
    <circle cx="0" cy="0" r="12" fill="#2A1F1F" />
    <path d="M-8 -8 L8 8 M-8 8 L8 -8" stroke="#D4AF37" stroke-width="1.5" />
  </g>

  <!-- Typography -->
  <g transform="translate(100, 75)">
    <!-- 'Shri' in Elegant Serif -->
    <text x="0" y="0" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-size="42" font-weight="600" fill="#2A1F1F" letter-spacing="1">Shri</text>
    <!-- 'Ramya' in Gold Gradient -->
    <text x="95" y="0" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-size="42" font-weight="400" fill="url(#goldGradient)" letter-spacing="2">Ramya</text>
    
    <!-- Tagline -->
    <text x="2" y="25" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#666" letter-spacing="4" text-transform="uppercase">The Heritage Collection</text>
  </g>
</svg>
