<svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ornamental Frame -->
  <path d="M10 40 Q10 15, 30 10 L170 10 Q190 15, 190 40 Q190 65, 170 70 L30 70 Q10 65, 10 40 Z" 
        stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.6"/>
  
  <!-- Inner decorative corners -->
  <circle cx="20" cy="20" r="2" fill="#D4AF37" opacity="0.8"/>
  <circle cx="180" cy="20" r="2" fill="#D4AF37" opacity="0.8"/>
  <circle cx="20" cy="60" r="2" fill="#D4AF37" opacity="0.8"/>
  <circle cx="180" cy="60" r="2" fill="#D4AF37" opacity="0.8"/>
  
  <!-- Central lotus motif -->
  <path d="M100 25 C95 25, 92 28, 92 32 C92 28, 89 25, 85 25 C89 25, 92 22, 92 18 C92 22, 95 25, 100 25 Z" 
        fill="#800020" opacity="0.3"/>
  <path d="M100 25 C105 25, 108 28, 108 32 C108 28, 111 25, 115 25 C111 25, 108 22, 108 18 C108 22, 105 25, 100 25 Z" 
        fill="#800020" opacity="0.3"/>
  
  <!-- Brand Text -->
  <text x="100" y="45" font-family="'Playfair Display', serif" font-size="20" font-weight="500" 
        text-anchor="middle" fill="#800020" letter-spacing="2">
    Shri Ramya
  </text>
  
  <!-- Tagline -->
  <text x="100" y="58" font-family="'Cormorant Garamond', serif" font-size="8" font-style="italic"
        text-anchor="middle" fill="#666666" letter-spacing="3">
    HERITAGE & LUXURY
  </text>
  
  <!-- Bottom ornamental line -->
  <line x1="40" y1="65" x2="70" y2="65" stroke="#D4AF37" stroke-width="0.5" opacity="0.6"/>
  <line x1="130" y1="65" x2="160" y2="65" stroke="#D4AF37" stroke-width="0.5" opacity="0.6"/>
  <circle cx="100" cy="65" r="1.5" fill="#D4AF37" opacity="0.8"/>
</svg>
