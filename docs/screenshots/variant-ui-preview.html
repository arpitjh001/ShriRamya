<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Variant Table UI Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #130f2b;
      --panel: rgba(30, 27, 75, 0.95);
      --line: rgba(148, 163, 184, 0.25);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --input-bg: rgba(255, 255, 255, 0.05);
      --danger: #f87171;
    }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: radial-gradient(circle at 20% 0%, #1f1747 0%, var(--bg) 45%, #090714 100%);
      color: var(--text);
      padding: 40px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .btn-add {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .table-wrap {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      padding: 8px;
      text-align: left;
      font-size: 12px;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text);
      padding: 7px;
      font-size: 12px;
      box-sizing: border-box;
    }

    .image-cell {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-upload {
      border: 1px solid rgba(99, 102, 241, 0.5);
      background: transparent;
      color: #a5b4fc;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 11px;
      white-space: nowrap;
    }

    .btn-delete {
      border: 1px solid rgba(239, 68, 68, 0.5);
      background: transparent;
      color: var(--danger);
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h2>Variants (4)</h2>
      <button class="btn-add">+ Add Variant</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>SKU</th>
            <th>Color</th>
            <th>Size</th>
            <th>Price</th>
            <th>Discount</th>
            <th>Stock</th>
            <th>Image URL</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><input value="SR-RED-S" /></td>
            <td><input value="Red" /></td>
            <td><input value="S" /></td>
            <td><input value="1999" /></td>
            <td><input value="1499" /></td>
            <td><input value="20" /></td>
            <td>
              <div class="image-cell">
                <input value="http://localhost:8080/uploads/red.png" />
                <button class="btn-upload">Upload</button>
              </div>
            </td>
            <td><button class="btn-delete">Delete</button></td>
          </tr>
          <tr>
            <td><input value="SR-RED-M" /></td>
            <td><input value="Red" /></td>
            <td><input value="M" /></td>
            <td><input value="2099" /></td>
            <td><input value="1599" /></td>
            <td><input value="18" /></td>
            <td>
              <div class="image-cell">
                <input value="http://localhost:8080/uploads/red.png" />
                <button class="btn-upload">Upload</button>
              </div>
            </td>
            <td><button class="btn-delete">Delete</button></td>
          </tr>
          <tr>
            <td><input value="SR-BLUE-S" /></td>
            <td><input value="Blue" /></td>
            <td><input value="S" /></td>
            <td><input value="2199" /></td>
            <td><input value="1699" /></td>
            <td><input value="16" /></td>
            <td>
              <div class="image-cell">
                <input value="http://localhost:8080/uploads/blue.png" />
                <button class="btn-upload">Upload</button>
              </div>
            </td>
            <td><button class="btn-delete">Delete</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
