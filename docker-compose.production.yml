version: "3.9"

networks:
  public:
    driver: bridge
  internal:
    internal: true # No internet access for DBs

services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: shriramya
      MYSQL_USER: shriramya_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    # PORTS REMOVED: DB NOT EXPOSED TO HOST

  mongodb:
    image: mongo:6
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    # PORTS REMOVED

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --save 60 1000 --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    # PORTS REMOVED

  backend:
    build: ./backend_node
    restart: always
    env_file:
      - ./backend_node/.env.production
    depends_on:
      - mongodb
      - mysql
      - redis
    environment:
      MONGO_URL: mongodb://mongodb:27017/
      DB_NAME: shriramya
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - public
      - internal

  frontend:
    build: ./frontend
    restart: always
    networks:
      - public

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.production.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs:ro
    networks:
      - public
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  mongo_data:
  upload_data:
  redis_data:
