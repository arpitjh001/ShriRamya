version: "3.9"

networks:
  public:
    driver: bridge
  internal:
    internal: true # No internet access for DBs

services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: shriramya
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./wordpress_conf/mysql-performance.cnf:/etc/mysql/conf.d/zzz-performance.cnf:ro
    networks:
      - internal
    # PORTS REMOVED: DB NOT EXPOSED TO HOST

  wordpress:
    image: wordpress:6.4-fpm-alpine
    restart: always
    depends_on:
      - mysql
    volumes:
      - ./wordpress:/var/www/html
      - ./uploads:/var/www/html/wp-content/uploads
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: shriramya
      WP_REDIS_HOST: redis
      WP_REDIS_PORT: 6379
      WP_REDIS_DATABASE: 0
      WP_REDIS_CLIENT: predis
      WP_REDIS_PASSWORD: ${REDIS_PASSWORD}
      WP_REDIS_PREFIX: "shriramya:"
      WP_CACHE_KEY_SALT: "shriramya:"
    networks:
      - internal
      - public

  mongodb:
    image: mongo:6
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    # PORTS REMOVED

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --save 60 1000 --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    # PORTS REMOVED

  wpcli:
    image: wordpress:cli
    restart: "no"
    depends_on:
      - mysql
      - wordpress
      - redis
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: shriramya
      WP_REDIS_HOST: redis
      WP_REDIS_PORT: 6379
      WP_REDIS_DATABASE: 0
      WP_REDIS_CLIENT: predis
      WP_REDIS_PASSWORD: ${REDIS_PASSWORD}
      WP_REDIS_PREFIX: "shriramya:"
      WP_CACHE_KEY_SALT: "shriramya:"
    volumes:
      - ./wordpress:/var/www/html
      - ./wordpress_conf/setup-redis-cache.sh:/usr/local/bin/setup-redis-cache.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/setup-redis-cache.sh"]
    networks:
      - internal

  backend:
    build: ./backend_node
    restart: always
    env_file:
      - ./backend_node/.env.production
    depends_on:
      - mongodb
      - mysql
      - redis
    environment:
      MONGO_URL: mongodb://mongodb:27017/
      DB_NAME: shriramya
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - public
      - internal

  frontend:
    build: ./frontend
    restart: always
    networks:
      - public

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.production.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs:ro
    networks:
      - public
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  mongo_data:
  upload_data:
  redis_data:
