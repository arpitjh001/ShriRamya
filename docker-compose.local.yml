version: "3.9"

services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shriramya
      MYSQL_USER: shriramya_user
      MYSQL_PASSWORD: shriramya_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306" # Local mapping for DB tools

  mongodb:
    image: mongo:6
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017" # Local mapping

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --save 60 1000
    ports:
      - "6379:6379" # Local mapping

  backend:
    build: ./backend_node
    restart: always
    env_file:
      - ./backend_node/.env
    depends_on:
      - mongodb
      - mysql
      - redis
    volumes:
      - ./uploads:/app/uploads
    environment:
      MONGO_URL: mongodb://mongodb:27017/
      DB_NAME: shriramya
      REDIS_URL: redis://redis:6379

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8080
    restart: always
    depends_on:
      - backend

  ai-proxy:
    build: ./ai-proxy
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - ai_proxy_data:/root/.claude

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
      - redis
      - ai-proxy

volumes:
  mysql_data:
  mongo_data:
  upload_data:
  redis_data:
  ai_proxy_data:
